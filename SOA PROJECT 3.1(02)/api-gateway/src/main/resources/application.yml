server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: auth-route
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**

        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: menu-route
          uri: lb://menu-service
          predicates:
            - Path=/api/menu/**

        - id: order-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka/

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

logging:
  level:
    com.netflix.discovery.shared.transport.decorator.RetryableEurekaHttpClient: ERROR
    com.netflix.discovery.shared.transport.decorator.RedirectingEurekaHttpClient: ERROR

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}